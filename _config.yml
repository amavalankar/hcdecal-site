# Welcome to Jekyll!
#
# This config file is meant for settings that affect your whole blog, values
# which you are expected to set up once and rarely edit after that. If you find
# yourself editing this file very often, consider using Jekyll's data files
# feature for the data you need to update frequently.
#
# For technical reasons, this file is *NOT* reloaded automatically when you use
# 'bundle exec jekyll serve'. If you change this file, please restart the server process.
#
# If you need help with YAML syntax, here are some quick references for you:
# https://learn-the-web.algonquindesign.ca/topics/markdown-yaml-cheat-sheet/#yaml
# https://learnxinyminutes.com/docs/yaml/
#
# Site settings
# These are used to personalize your new site. If you look in the HTML files,
# you will see them accessed via {{ site.title }}, {{ site.email }}, and so on.
# You can create any custom variable you would like, and they will be accessible
# in the templates via {{ site.myvariable }}.

title: the human-centered design decal
tagline: hcd decal
email: staff@hcd-decal.org
description: >- # this means to ignore newlines until "baseurl:"
  The course website for Berkeley Innovation's Human-Centered Design DeCal—a student taught course at UC Berkeley.
baseurl: "" # the subpath of your site, e.g. /blog
url: "https://hcd-decal.org" # the base hostname & protocol for your site, e.g. http://example.com

# Build settings
sass:
  sass_dir: _scss

plugins:
  - jekyll-notion
  - jekyll-toc

permalink: pretty

toc:
  min_level: 2
  max_level: 3
    
defaults:
  -
    scope:
      path: ""
      type: "pages"
    values:
      layout: "default"
      toc: true
  -
    scope:
      path: ""
      type: assignments
    values:
      layout: docs
      toc: true
  -
    scope:
      path: ""
      type: individual-pages
    values:
      toc: true
  -
    scope:
      path: ""
      type: redirect
    values:
      layout: "redirect"

collections:
  assignments:
    output: true
  individual-pages:
    output: true
  redirect:
    output: true

notion:
  databases:
    - id: 3896ad6a06864b7eb7474929272148ba
      collection: individual-pages
    - id: 6f706551c9db4858bf46e794adeb1a37
      collection: assignments
    - id: 0a073988327b455ca02e849dca582eec
      data: schedule
      sorts: [{ "property": "Meeting Date", "direction": "ascending" }]
    - id: 7d2d9a790e4d477ca58d546545e8e9f0
      data: staff
      sorts: [{ "property": "Role", "direction": "descending" }]
    - id: 27e57ee8486146e3b0f07a624f5b9789
      data: faqs
    - id: 3896ad6a06864b7eb7474929272148ba
      collection: redirect
    

app-url: "https://docs.google.com/forms/d/e/1FAIpQLSecMsEe9FXMsgRQqCbyXNCMF5ds-dY57TAK38_315NLfXuZWw/viewform"
gems:
  - jekyll-liquify
